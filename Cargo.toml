[package]
name = "ktx-rs"
version = "4.4.2"
edition = "2024"
description = "Rust port of Khronos KTX-Software (libktx and ktx CLI)"
license = "Apache-2.0 AND BSD-3-Clause AND MIT AND Zlib"
repository = "https://github.com/qbart/ktx-rs"
# The published crate leaves out the test data, which has its own licenses (see NOTICE.md).
include = ["/src/**", "/man/**", "/Cargo.toml", "/LICENSE", "/LICENSES/**", "/NOTICE.md", "/README.md"]

[lib]
name = "ktx"
path = "src/lib.rs"

[features]
# LIBKTX_FEATURE_VK_UPLOAD (ON by default upstream): Vulkan texture upload (vkloader.c).
default = ["vulkan"]
vulkan = ["dep:ash", "dep:libloading"]
# LIBKTX_FEATURE_GL_UPLOAD: OpenGL {,ES} texture upload (glloader.c). Opt-in: OpenGL is the
# second allowed C binding.
opengl = ["dep:libloading"]

[workspace]
members = ["macros"]

[dependencies]
bytemuck = "1.25.2"
ktx-rs-macros = { path = "macros", version = "4.4.2" }
miniz_oxide = "0.9.1"
ruzstd = "0.9.1"
zstd-pure-rs = "0.2.0"

# Vulkan is the only allowed C binding: ash provides the types, libloading finds the
# application's Vulkan library like ktxLoadVulkanLibrary. Neither exists on wasm, where the
# `vulkan` and `opengl` features are no-ops.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["std", "debug"], optional = true }
libloading = { version = "0.8.9", optional = true }

[lints.rust]
# Denied everywhere except the Vulkan and OpenGL loaders (src/vkloader.rs, src/glloader.rs) and
# astcenc SIMD (src/astcenc/enc/sse.rs kernels, instruction set dispatch in src/astcenc/mod.rs).
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"

# GPU loader tests only (they need a real Vulkan / EGL library).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ash = { version = "0.38.0", features = ["loaded"] }
libloading = "0.8.9"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
