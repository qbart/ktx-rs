[package]
name = "ktx"
version = "0.1.0"
edition = "2024"
description = "Pure Rust port of Khronos KTX-Software (libktx and ktx CLI)"
license = "Apache-2.0"
repository = "https://github.com/KhronosGroup/KTX-Software"

[lib]
name = "ktx"
path = "src/lib.rs"

[features]
# LIBKTX_FEATURE_VK_UPLOAD (ON by default upstream): Vulkan texture upload (vkloader.c).
default = ["vulkan"]
vulkan = ["dep:ash", "dep:libloading"]

[dependencies]
bytemuck = "1.25.2"
miniz_oxide = "0.9.1"
ruzstd = "0.9.1"
zstd-pure-rs = "0.2.0"
# Vulkan is the only allowed C binding: ash provides the types, libloading finds the
# application's Vulkan library like ktxLoadVulkanLibrary.
ash = { version = "0.38.0", default-features = false, features = ["std", "debug"], optional = true }
libloading = { version = "0.8.9", optional = true }

[lints.rust]
# Denied everywhere except the Vulkan loader (src/vkloader.rs).
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
ash = { version = "0.38.0", features = ["loaded"] }
libloading = "0.8.9"
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
