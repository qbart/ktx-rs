[package]
name = "ktx"
version = "0.1.0"
edition = "2024"
description = "Pure Rust port of Khronos KTX-Software (libktx and ktx CLI)"
license = "Apache-2.0"
repository = "https://github.com/KhronosGroup/KTX-Software"

[lib]
name = "ktx"
path = "src/lib.rs"

[dependencies]
miniz_oxide = "0.9.1"
ruzstd = "0.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
